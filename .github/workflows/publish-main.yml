name: Release

# Publishes whop-sdk to PyPI and GitHub whenever main carries a version not yet published
# there. Only whop-monorepo's SDK pipeline pushes main, and it renders this workflow
# (sdks/release/publish-main.yml.liquid there): plan asks each module whether it has the version
# (.github/release/cli.ts), build checks and packages it (scripts/package.sh), and one job per
# module publishes it, in order. Re-running a run, or dispatching one on main, publishes nothing a
# module already has.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, in push order: every run waits its turn, so no version a delivery raised
# is skipped.
concurrency:
  group: publish-whopsdk-python
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      page: ${{ steps.plan.outputs.page }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/release

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          package-manager-cache: false

      - id: plan
        run: node .github/release/cli.ts plan --module pypi --module github
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The release, built and checked from this commit: scripts/package.sh leaves what each module's
  # job publishes where the build uploads it from.
  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Package the release
        id: package
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: bash scripts/package.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Trusted publishing from the main-only pypi environment; no long-lived token.
  pypi:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: ${{ needs.plan.outputs.page }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/release

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          print-hash: true
          skip-existing: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Wait until PyPI has the version
        run: node .github/release/cli.ts confirm --module pypi

  # Runs even when nothing was published: a version tagged before it had a GitHub release gets one,
  # and a repo shipped dark writes nothing. A new tag goes only on the commit of the run that planned
  # to publish (PUBLISHED): re-run that run's failed jobs.
  github:
    needs: [plan, build, pypi]
    if: ${{ !cancelled() && needs.plan.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # cli.ts release creates the version's tag and GitHub release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/release

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          package-manager-cache: false

      - run: node .github/release/cli.ts release --module pypi --module github
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ needs.plan.outputs.publish == 'true' }}
